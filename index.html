<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="柴郡猫计算器">
<meta name="theme-color" content="#f5f5f7">
<title>柴郡猫工资计算器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f5f7;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    color: #1d1d1f;
  }
  .app { width: 100%; max-width: 400px; }
  h1 { font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 20px; letter-spacing: 0.5px; }

  .card {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    margin-bottom: 16px;
  }

  /* 档位选择 */
  .tier-label { font-size: 13px; color: #86868b; margin-bottom: 8px; }
  .tier-group {
    display: flex;
    background: #f5f5f7;
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
    margin-bottom: 16px;
  }
  .tier-btn {
    flex: 1;
    padding: 8px 0;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    background: transparent;
    color: #86868b;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .tier-btn.active {
    background: #fff;
    color: #0071e3;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  /* 时间输入 */
  .time-row { display: flex; gap: 12px; }
  .time-field { flex: 1; }
  .time-field label { display: block; font-size: 13px; color: #86868b; margin-bottom: 6px; }
  .time-field input {
    width: 100%;
    padding: 12px;
    font-size: 17px;
    border: 1px solid #d2d2d7;
    border-radius: 10px;
    background: #fff;
    color: #1d1d1f;
    font-variant-numeric: tabular-nums;
    outline: none;
    transition: border-color 0.2s;
    appearance: none;
    -webkit-appearance: none;
  }
  .time-field input:focus { border-color: #0071e3; box-shadow: 0 0 0 3px rgba(0,113,227,0.15); }

  /* 工作时长标签 */
  .duration-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #f5f5f7;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    color: #1d1d1f;
    margin-top: 16px;
    font-variant-numeric: tabular-nums;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #34c759; flex-shrink: 0; }

  /* 结果 */
  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
  .result-row .val { font-weight: 500; }
  .result-row.deduction .val { color: #ff3b30; }
  .result-row.final {
    border-top: 1px solid #e8e8ed;
    margin-top: 6px;
    padding-top: 16px;
  }
  .result-row.final .label { font-weight: 600; }
  .result-row.final .val { font-size: 26px; font-weight: 700; color: #34c759; }

  /* 底部规则提示 */
  .rule-hint {
    text-align: center;
    font-size: 12px;
    color: #86868b;
    line-height: 1.6;
    padding: 0 8px;
  }
</style>
</head>
<body>
<div class="app">
  <h1>柴郡猫工资计算器</h1>

  <div class="card">
    <div class="tier-label">时薪档位</div>
    <div class="tier-group">
      <button class="tier-btn active" id="tier-40" onclick="switchTier(40)">40 元/时</button>
      <button class="tier-btn" id="tier-45" onclick="switchTier(45)">45 元/时</button>
      <button class="tier-btn" id="tier-50" onclick="switchTier(50)">50 元/时</button>
    </div>

    <div class="time-row">
      <div class="time-field">
        <label>开始时间</label>
        <input type="time" id="start-time" value="09:00">
      </div>
      <div class="time-field">
        <label>结束时间</label>
        <input type="time" id="end-time" value="18:00">
      </div>
    </div>

    <div class="duration-tag"><span class="dot"></span><span id="duration-text">工作时长：9 小时 0 分钟</span></div>
  </div>

  <div class="card">
    <div class="result-row">
      <span>工资金额</span>
      <span class="val" id="gross">¥360.00</span>
    </div>
    <div class="result-row deduction">
      <span>抽成（10%）</span>
      <span class="val" id="deduction">-¥36.00</span>
    </div>
    <div class="result-row final">
      <span class="label">实发工资</span>
      <span class="val" id="net">¥324.00</span>
    </div>
  </div>

  <div class="rule-hint" id="rule-hint">柴郡猫：时薪 40 元，超时按 0.25/0.5/0.75/1 小时折算，抽成 10%</div>
</div>

<script>
  var catRate = 40;

  function switchTier(rate) {
    catRate = rate;
    [40, 45, 50].forEach(function(r) {
      document.getElementById('tier-' + r).classList.toggle('active', r === rate);
    });
    document.getElementById('rule-hint').textContent =
      '柴郡猫：时薪 ' + catRate + ' 元，超时按 0.25/0.5/0.75/1 小时折算，抽成 10%';
    calculate();
  }

  // 超时分钟 → 折算小时
  function overtimeHours(om) {
    if (om <= 10) return 0;
    if (om <= 19) return 0.25;
    if (om <= 39) return 0.5;
    if (om <= 50) return 0.75;
    return 1;
  }

  function fmt(n) { return '¥' + n.toFixed(2); }

  function calculate() {
    var startVal = document.getElementById('start-time').value;
    var endVal = document.getElementById('end-time').value;
    if (!startVal || !endVal) return;

    var sp = startVal.split(':'), ep = endVal.split(':');
    var totalMin = (parseInt(ep[0], 10) * 60 + parseInt(ep[1], 10)) -
                   (parseInt(sp[0], 10) * 60 + parseInt(sp[1], 10));
    if (totalMin < 0) totalMin += 1440; // 跨天

    var hours = Math.floor(totalMin / 60);
    var om = totalMin % 60;

    document.getElementById('duration-text').textContent =
      '工作时长：' + hours + ' 小时 ' + om + ' 分钟';

    var gross = hours * catRate + overtimeHours(om) * catRate;
    var ded = gross * 0.10;
    document.getElementById('gross').textContent = fmt(gross);
    document.getElementById('deduction').textContent = '-' + fmt(ded);
    document.getElementById('net').textContent = fmt(gross - ded);
  }

  document.getElementById('start-time').addEventListener('change', calculate);
  document.getElementById('end-time').addEventListener('change', calculate);
  document.getElementById('start-time').addEventListener('input', calculate);
  document.getElementById('end-time').addEventListener('input', calculate);

  calculate();
</script>
</body>
</html>
