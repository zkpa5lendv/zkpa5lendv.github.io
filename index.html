<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工资计算器">
<meta name="theme-color" content="#f5f5f7">
<title>工资计算器（个人版）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f5f7;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    color: #1d1d1f;
  }
  .app { width: 100%; max-width: 400px; }
  h1 { font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 20px; letter-spacing: 0.5px; }
  h2 { font-size: 17px; font-weight: 600; margin: 24px 0 10px; }

  .tabs {
    display: flex;
    background: #e8e8ed;
    border-radius: 12px;
    padding: 3px;
    margin-bottom: 16px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 0;
    border: none;
    border-radius: 9px;
    font-size: 15px;
    font-weight: 500;
    background: transparent;
    color: #86868b;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .tab-btn.active {
    background: #fff;
    color: #1d1d1f;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .system { display: none; }
  .system.show { display: block; }

  .card {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    margin-bottom: 16px;
  }

  .tier-label { font-size: 13px; color: #86868b; margin-bottom: 8px; }
  .tier-group {
    display: flex;
    background: #f5f5f7;
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
    margin-bottom: 16px;
  }
  .tier-btn {
    flex: 1;
    padding: 8px 0;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    background: transparent;
    color: #86868b;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .tier-btn.active {
    background: #fff;
    color: #0071e3;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  .time-row { display: flex; gap: 12px; }
  .time-field { flex: 1; }
  .time-field label { display: block; font-size: 13px; color: #86868b; margin-bottom: 6px; }
  .time-field input {
    width: 100%;
    padding: 12px;
    font-size: 17px;
    border: 1px solid #d2d2d7;
    border-radius: 10px;
    background: #fff;
    color: #1d1d1f;
    font-variant-numeric: tabular-nums;
    outline: none;
    transition: border-color 0.2s;
    appearance: none;
    -webkit-appearance: none;
  }
  .time-field input:focus { border-color: #0071e3; box-shadow: 0 0 0 3px rgba(0,113,227,0.15); }

  .duration-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #f5f5f7;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    color: #1d1d1f;
    margin-top: 16px;
    font-variant-numeric: tabular-nums;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #34c759; flex-shrink: 0; }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
  .result-row .val { font-weight: 500; }
  .result-row.deduction .val { color: #ff3b30; }
  .result-row.final {
    border-top: 1px solid #e8e8ed;
    margin-top: 6px;
    padding-top: 16px;
  }
  .result-row.final .label { font-weight: 600; }
  .result-row.final .val { font-size: 26px; font-weight: 700; color: #34c759; }

  .save-btn {
    width: 100%;
    padding: 13px 0;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    background: #0071e3;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-bottom: 16px;
  }
  .save-btn:active { background: #0060c7; transform: scale(0.98); }
  .save-btn.saved { background: #34c759; }

  .rule-hint {
    text-align: center;
    font-size: 12px;
    color: #86868b;
    line-height: 1.6;
    padding: 0 8px;
  }

  .day-card {
    background: #fff;
    border-radius: 16px;
    padding: 16px 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    margin-bottom: 12px;
  }
  .day-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    border-bottom: 1px solid #f0f0f2;
    margin-bottom: 4px;
  }
  .day-date { font-size: 15px; font-weight: 600; }
  .day-total { font-size: 12px; color: #86868b; text-align: right; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .day-total b { color: #1d1d1f; }
  .day-total .inc { color: #34c759; font-weight: 600; }

  .entry {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #f5f5f7;
    font-size: 14px;
  }
  .entry:last-child { border-bottom: none; padding-bottom: 2px; }
  .entry-info { line-height: 1.5; }
  .entry-title { font-weight: 500; }
  .entry-sub { font-size: 12px; color: #86868b; font-variant-numeric: tabular-nums; }
  .entry-nums { text-align: right; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .entry-ded { font-size: 12px; color: #ff3b30; }
  .entry-net { font-weight: 600; color: #34c759; }
  .entry-del {
    border: none;
    background: none;
    color: #c7c7cc;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 0 4px 10px;
    margin-left: 6px;
  }
  .entry-del:active { color: #ff3b30; }
  .entry-right { display: flex; align-items: center; }

  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 5px;
    margin-right: 5px;
    vertical-align: 1px;
  }
  .badge-cat { background: #e8f0fe; color: #0071e3; }
  .badge-moon { background: #f3e8fd; color: #af52de; }

  .empty-hint { text-align: center; color: #86868b; font-size: 13px; padding: 20px 0 4px; }
  .clear-btn {
    display: block;
    margin: 4px auto 0;
    border: none;
    background: none;
    color: #ff3b30;
    font-size: 13px;
    cursor: pointer;
    padding: 8px;
  }
</style>
</head>
<body>
<div class="app">
  <h1>工资计算器</h1>

  <div class="tabs">
    <button class="tab-btn active" id="tab-cat" onclick="switchTab('cat')">柴郡猫</button>
    <button class="tab-btn" id="tab-moon" onclick="switchTab('moon')">明月心</button>
  </div>

  <div class="system show" id="system-cat">
    <div class="card">
      <div class="tier-label">时薪档位</div>
      <div class="tier-group">
        <button class="tier-btn active" id="tier-40" onclick="switchTier(40)">40 元/时</button>
        <button class="tier-btn" id="tier-45" onclick="switchTier(45)">45 元/时</button>
        <button class="tier-btn" id="tier-50" onclick="switchTier(50)">50 元/时</button>
      </div>

      <div class="time-row">
        <div class="time-field">
          <label>开始时间</label>
          <input type="time" id="cat-start" value="09:00">
        </div>
        <div class="time-field">
          <label>结束时间</label>
          <input type="time" id="cat-end" value="18:00">
        </div>
      </div>

      <div class="duration-tag"><span class="dot"></span><span id="cat-duration">工作时长：9 小时 0 分钟</span></div>
    </div>

    <div class="card">
      <div class="result-row">
        <span>工资金额</span>
        <span class="val" id="cat-gross">¥360.00</span>
      </div>
      <div class="result-row deduction">
        <span>抽成（10%）</span>
        <span class="val" id="cat-deduction">-¥36.00</span>
      </div>
      <div class="result-row final">
        <span class="label">实发工资</span>
        <span class="val" id="cat-net">¥324.00</span>
      </div>
    </div>

    <button class="save-btn" id="cat-save" onclick="saveRecord('cat')">保存本次记录</button>
    <div class="rule-hint" id="cat-hint">柴郡猫：时薪 40 元，超时按 0.25/0.5/0.75/1 小时折算，抽成 10%</div>
  </div>

  <div class="system" id="system-moon">
    <div class="card">
      <div class="time-row">
        <div class="time-field">
          <label>开始时间</label>
          <input type="time" id="moon-start" value="09:00">
        </div>
        <div class="time-field">
          <label>结束时间</label>
          <input type="time" id="moon-end" value="18:00">
        </div>
      </div>

      <div class="duration-tag"><span class="dot"></span><span id="moon-duration">工作时长：9 小时 0 分钟</span></div>
    </div>

    <div class="card">
      <div class="result-row">
        <span>工资金额</span>
        <span class="val" id="moon-gross">¥315.00</span>
      </div>
      <div class="result-row deduction">
        <span>抽成</span>
        <span class="val" id="moon-deduction">-¥27.00</span>
      </div>
      <div class="result-row final">
        <span class="label">实发工资</span>
        <span class="val" id="moon-net">¥288.00</span>
      </div>
    </div>

    <button class="save-btn" id="moon-save" onclick="saveRecord('moon')">保存本次记录</button>
    <div class="rule-hint">明月心：时薪 35 元，超时按固定金额分档，基础抽成 3 元/整小时 + 超时抽成</div>
  </div>

  <h2>计算记录</h2>
  <div id="records"></div>
  <div class="empty-hint" id="empty-hint">还没有记录，算完点「保存本次记录」即可记账</div>
  <button class="clear-btn" id="clear-btn" style="display:none" onclick="clearAll()">清空全部记录</button>
</div>

<script>
  var catRate = 40;
  var LS_KEY = 'wage_records_v1';

  function catOvertimeHours(om) {
    if (om <= 10) return 0;
    if (om <= 19) return 0.25;
    if (om <= 39) return 0.5;
    if (om <= 50) return 0.75;
    return 1;
  }
  function moonOvertimePay(om) {
    if (om < 10) return 0;
    if (om <= 14) return 6;
    if (om <= 24) return 12;
    if (om <= 34) return 17;
    if (om <= 44) return 24;
    if (om <= 54) return 30;
    return 35;
  }
  function fmt(n) { return '¥' + n.toFixed(2); }
  function parseDuration(startVal, endVal) {
    if (!startVal || !endVal) return null;
    var sp = startVal.split(':'), ep = endVal.split(':');
    var totalMin = (parseInt(ep[0], 10) * 60 + parseInt(ep[1], 10)) -
                   (parseInt(sp[0], 10) * 60 + parseInt(sp[1], 10));
    if (totalMin < 0) totalMin += 1440;
    return { hours: Math.floor(totalMin / 60), om: totalMin % 60, totalMin: totalMin };
  }

  function calcCat() {
    var d = parseDuration(document.getElementById('cat-start').value,
                          document.getElementById('cat-end').value);
    if (!d) return null;
    document.getElementById('cat-duration').textContent =
      '工作时长：' + d.hours + ' 小时 ' + d.om + ' 分钟';
    var gross = d.hours * catRate + catOvertimeHours(d.om) * catRate;
    var ded = gross * 0.10;
    document.getElementById('cat-gross').textContent = fmt(gross);
    document.getElementById('cat-deduction').textContent = '-' + fmt(ded);
    document.getElementById('cat-net').textContent = fmt(gross - ded);
    return { gross: gross, ded: ded, net: gross - ded, d: d };
  }

  function calcMoon() {
    var d = parseDuration(document.getElementById('moon-start').value,
                          document.getElementById('moon-end').value);
    if (!d) return null;
    document.getElementById('moon-duration').textContent =
      '工作时长：' + d.hours + ' 小时 ' + d.om + ' 分钟';
    var gross = d.hours * 35 + moonOvertimePay(d.om);
    var ded = d.hours * 3 + (d.om < 10 ? 0 : (Math.round(d.om / 10) * 10 / 10) * 0.5);
    document.getElementById('moon-gross').textContent = fmt(gross);
    document.getElementById('moon-deduction').textContent = '-' + fmt(ded);
    document.getElementById('moon-net').textContent = fmt(gross - ded);
    return { gross: gross, ded: ded, net: gross - ded, d: d };
  }

  function switchTab(tab) {
    document.getElementById('tab-cat').classList.toggle('active', tab === 'cat');
    document.getElementById('tab-moon').classList.toggle('active', tab === 'moon');
    document.getElementById('system-cat').classList.toggle('show', tab === 'cat');
    document.getElementById('system-moon').classList.toggle('show', tab === 'moon');
  }
  function switchTier(rate) {
    catRate = rate;
    [40, 45, 50].forEach(function(r) {
      document.getElementById('tier-' + r).classList.toggle('active', r === rate);
    });
    document.getElementById('cat-hint').textContent =
      '柴郡猫：时薪 ' + catRate + ' 元，超时按 0.25/0.5/0.75/1 小时折算，抽成 10%';
    calcCat();
  }

  function loadRecords() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
    catch (e) { return []; }
  }
  function storeRecords(list) {
    localStorage.setItem(LS_KEY, JSON.stringify(list));
  }

  function saveRecord(sys) {
    var r = sys === 'cat' ? calcCat() : calcMoon();
    if (!r) return;
    var start = document.getElementById(sys + '-start').value;
    var end = document.getElementById(sys + '-end').value;
    var now = new Date();
    var dateStr = now.getFullYear() + '-' +
                  String(now.getMonth() + 1).padStart(2, '0') + '-' +
                  String(now.getDate()).padStart(2, '0');
    var rec = {
      id: now.getTime(),
      system: sys,
      tier: sys === 'cat' ? catRate : 35,
      start: start,
      end: end,
      totalMin: r.d.totalMin,
      hours: r.d.hours,
      om: r.d.om,
      gross: r.gross,
      ded: r.ded,
      net: r.net,
      date: dateStr
    };
    var list = loadRecords();
    list.push(rec);
    storeRecords(list);
    renderRecords();

    var btn = document.getElementById(sys + '-save');
    btn.textContent = '已保存 ✓';
    btn.classList.add('saved');
    setTimeout(function() {
      btn.textContent = '保存本次记录';
      btn.classList.remove('saved');
    }, 1200);
  }

  function deleteRecord(id) {
    var list = loadRecords().filter(function(r) { return r.id !== id; });
    storeRecords(list);
    renderRecords();
  }

  function clearAll() {
    if (!confirm('确定清空全部记录吗？此操作不可恢复。')) return;
    storeRecords([]);
    renderRecords();
  }

  function fmtDur(totalMin) {
    var h = Math.floor(totalMin / 60), m = totalMin % 60;
    return h + ' 小时 ' + m + ' 分钟';
  }

  function renderRecords() {
    var list = loadRecords();
    var box = document.getElementById('records');
    document.getElementById('empty-hint').style.display = list.length ? 'none' : 'block';
    document.getElementById('clear-btn').style.display = list.length ? 'block' : 'none';
    box.innerHTML = '';

    var groups = {};
    var dates = [];
    list.forEach(function(r) {
      if (!groups[r.date]) { groups[r.date] = []; dates.push(r.date); }
      groups[r.date].push(r);
    });
    dates.sort().reverse();

    dates.forEach(function(date) {
      var entries = groups[date];
      var totMin = 0, totDed = 0, totNet = 0;
      entries.forEach(function(r) { totMin += r.totalMin; totDed += r.ded; totNet += r.net; });

      var card = document.createElement('div');
      card.className = 'day-card';

      var header = '<div class="day-header">' +
        '<span class="day-date">' + date + '</span>' +
        '<span class="day-total">共 <b>' + fmtDur(totMin) + '</b><br>' +
        '抽成 ' + fmt(totDed) + ' · <span class="inc">收入 ' + fmt(totNet) + '</span></span>' +
        '</div>';

      var rows = entries.map(function(r) {
        var isCat = r.system === 'cat';
        var badge = isCat
          ? '<span class="badge badge-cat">柴郡猫 ' + r.tier + '档</span>'
          : '<span class="badge badge-moon">明月心</span>';
        return '<div class="entry">' +
          '<div class="entry-info">' +
            '<div class="entry-title">' + badge + r.start + ' – ' + r.end + '</div>' +
            '<div class="entry-sub">时长 ' + fmtDur(r.totalMin) + '</div>' +
          '</div>' +
          '<div class="entry-right">' +
            '<div class="entry-nums">' +
              '<div class="entry-ded">抽成 ' + fmt(r.ded) + '</div>' +
              '<div class="entry-net">收入 ' + fmt(r.net) + '</div>' +
            '</div>' +
            '<button class="entry-del" onclick="deleteRecord(' + r.id + ')" title="删除">×</button>' +
          '</div>' +
        '</div>';
      }).join('');

      card.innerHTML = header + rows;
      box.appendChild(card);
    });
  }

  ['cat-start', 'cat-end'].forEach(function(id) {
    document.getElementById(id).addEventListener('change', calcCat);
    document.getElementById(id).addEventListener('input', calcCat);
  });
  ['moon-start', 'moon-end'].forEach(function(id) {
    document.getElementById(id).addEventListener('change', calcMoon);
    document.getElementById(id).addEventListener('input', calcMoon);
  });

  calcCat();
  calcMoon();
  renderRecords();
</script>
</body>
</html>
